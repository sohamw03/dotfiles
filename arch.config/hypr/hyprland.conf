# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 1920x1080@144, 0x0, 1

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
# Set programs that you use
$terminal = ghostty
$menu = vicinae toggle


xwayland {
    force_zero_scaling = true
}

# Some default env vars.
env = XCURSOR_SIZE,8
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that
env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,iHD
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# env = NVD_BACKEND,direct
env = GDK_SCALE, 1
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
# install gnome-themes-extra; nwg-look; qt6ct

cursor {
    no_hardware_cursors = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # Change speed of keyboard repeat
    repeat_rate = 25
    repeat_delay = 400

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.09
    }

    accel_profile = none  # Can be flat, adaptive, or none.
    force_no_accel = 1         # 0 enables acceleration, 1 disables it.
    sensitivity = 0.35      # Range -1.0 to 1.0, where 0 means no change.
    follow_mouse = 1

    scroll_method = on_button_down
    scroll_button = 274
}
# device {
#     name = elan0710:00-04f3:30ed-touchpad
#     accel_profile = none  # Can be flat, adaptive, or none.
#     sensitivity = 0.35      # Range -1.0 to 1.0, where 0 means no change.
# }

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    border_size = 1

    # col.active_border = $mauve $flamingo 90deg
    # col.inactive_border = $subtext0
    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    # col.active_border = rgba(66bcbbaa) rgba(88aaaacc) 45deg
    # col.inactive_border = rgba(88888877)

    resize_on_border = true

    gaps_in = 2
    gaps_out = 3

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 8
    rounding_power = 2

    shadow {
        enabled = false
        # range = 2
        # render_power = 3
        # color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        # size = 3
        # passes = 3
        # vibrancy = 0.1696
        # new_optimizations = true
        # xray = false
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

scrolling {
    column_width = 0.75
}

# master {
#     # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#     new_is_master = true
# }

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
}
gesture = 3, horizontal, scale:0.4, workspace
gesture = 3, vertical, dispatcher, fullscreen
gesture = 4, up, dispatcher, exec, qs -c noctalia-shell ipc call volume increase
gesture = 4, down, dispatcher, exec, qs -c noctalia-shell ipc call volume decrease
gesture = 4, left, dispatcher, exec, qs -c noctalia-shell ipc call media next
gesture = 4, right, dispatcher, exec, qs -c noctalia-shell ipc call media previous

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disablgesture = 3, up, mod: SUPER, scale: 1.5, fullscreene the anime mascot wallpapers
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
    vrr = 0
}

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppress_event maximize, match:class .* # You'll probably like this.
# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Browser types
windowrule = tag +chromium-based-browser, match:class ([cC]hrom(e|ium)|[bB]rave-browser|Microsoft-edge|Vivaldi-stable)
windowrule = tag +firefox-based-browser, match:class (Firefox|zen|librewolf)
# Force chromium-based browsers into a tile to deal with --app bug
windowrule = tile on, match:tag chromium-based-browser

# Floating windows
windowrule = float on, center on, size 800 600, match:tag floating-window
windowrule = tag +floating-window, match:class (blueberry.py|Impala|Wiremix|org.gnome.NautilusPreviewer|com.gabm.satty|Omarchy|About|TUI.float|org.gnome.Loupe|com.ghostty.floating)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus|dev.zed.Zed), match:title ^(Open.*Files?|Open Folder|Save.*Files?|Save.*As|Save|All Files|Zed — Settings)
windowrule = float on, center on, size 1300 850, match:class (com.ghostty.btop)

# Fullscreen screensaver
windowrule = fullscreen on, match:class Screensaver

# No transparency on media windows
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$

# Application-specific animation
layerrule = blur on, ignore_alpha 0.1 waybar
layerrule = no_anim on, match:namespace vicinae

# Picture in picture
windowrule = float on, pin on, match:title ^(Picture in picture)

# No border on single window
windowrule = border_size 0, match:workspace w[tv1]


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = ALT

binds {
    # binds = ALT_R, E, workspace, previous
    binds = ALT_R, E, focuscurrentorlast
    binds = ALT_R, T, focuswindow, class:^(com.mitchellh.ghostty)$
    binds = ALT_R, C, focuswindow, class:^(google-chrome)$
    binds = ALT_R, B, focuswindow, class:^(brave-browser)$

    bind = SUPER, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history
    bind = SUPER, period, exec, vicinae vicinae://extensions/vicinae/core/search-emojis
}

# Only display the OSD on the currently focused monitor
# $osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"
# $qs_ipc = qs -p ~/.config/noctalia-shell/ ipc call
$qs_ipc = qs -c noctalia-shell ipc call

# Desktop multimedia keys for volume and LCD brightness (with OSD)
bindid = ,XF86AudioRaiseVolume, Volume up, exec, $qs_ipc volume increase
bindid = ,XF86AudioLowerVolume, Volume down, exec, $qs_ipc volume decrease
bindid = ,XF86AudioMute, Mute, exec, $qs_ipc volume muteOutput
bindid = ,XF86AudioMicMute, Mute microphone, exec, $qs_ipc volume muteInput
bindid = ,XF86MonBrightnessUp, Brightness up, exec, $qs_ipc brightness increase
bindid = ,XF86MonBrightnessDown, Brightness down, exec, $qs_ipc brightness decrease
binds = ALT_R, Up, exec, $qs_ipc volume increase
binds = ALT_R, Down, exec, $qs_ipc volume decrease

# Requires playerctl
bindid = ,XF86AudioNext, Next track, exec, $qs_ipc media next
bindid = ,XF86AudioPause, Pause, exec, $qs_ipc media playPause
bindid = ,XF86AudioPlay, Play, exec, $qs_ipc media playPause
bindid = ,XF86AudioPrev, Previous track, exec, $qs_ipc media previous

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
binds = ALT_R&SHIFT_R, Q, killactive
bind = $mainMod_SHIFT, M, exit
binds = ALT_R, V, togglefloating
bind = $mainMod, space, exec, $menu
bind = CTRL_SHIFT, l, exec, qs -c noctalia-shell ipc call lockScreen lock
bind = SUPER_SHIFT, R, exec, hyprctl reload
bind = SUPER_SHIFT, S, exec, hyprshot -z -m region -o /home/soham/Pictures/Screenshots/
bind = CTRL_SHIFT, S, exec, hyprshot -z -m window -o /home/soham/Pictures/Screenshots/
bind = SUPER_SHIFT, bracketleft, exec, hyprshot -z -m output -o /home/soham/Pictures/Screenshots/
# bind = $mainMod, P, pseudo, # dwindle
bind = SUPER, E, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, # dwindle
# bind = $mainMod, W, togglegroup, # dwindle

# Move focus with mainMod + arrow keys
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod_SHIFT, 1, movetoworkspace, 1
bind = $mainMod_SHIFT, 2, movetoworkspace, 2
bind = $mainMod_SHIFT, 3, movetoworkspace, 3
bind = $mainMod_SHIFT, 4, movetoworkspace, 4
bind = $mainMod_SHIFT, 5, movetoworkspace, 5
bind = $mainMod_SHIFT, 6, movetoworkspace, 6
bind = $mainMod_SHIFT, 7, movetoworkspace, 7
bind = $mainMod_SHIFT, 8, movetoworkspace, 8
bind = $mainMod_SHIFT, 9, movetoworkspace, 9
bind = $mainMod_SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod_SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = SUPER_SHIFT, h, movewindow, l
bind = SUPER_SHIFT, l, movewindow, r
bind = SUPER_SHIFT, k, movewindow, u
bind = SUPER_SHIFT, j, movewindow, d

# Cycle wallpaper
# bind=SUPER, N, exec, /home/soham/.config/hypr/next-wallpaper.sh
bind=SUPER, N, exec, $qs_ipc wallpaper random eDP-1
