close_when_open = true
theme = "omarchy-default"
# theme_base = []
theme_localtion = ["themes"]
hotreload_theme = true
force_keyboard_focus = true
timeout = 60

[list]
max_entries = 200
cycle = true

[search]
placeholder = " Search..."

[builtins.hyprland_keybinds]
path = "~/.config/hypr/hyprland.conf"
hidden = true

[builtins.applications]
launch_prefix = "uwsm app -- "
placeholder = " Search..."
prioritize_new = false
context_aware = false
show_sub_when_single = false
history = true
hidden = true

[builtins.applications.actions]
enabled = false
hide_category = true

[builtins.bookmarks]
hidden = true

[builtins.calc]
name = "Calculator"
icon = ""
min_chars = 3
prefix = "="

[builtins.windows]
switcher_only = true
hidden = true

[builtins.clipboard]
always_put_new_on_top = true
exec = "wl-copy"
weight = 5
icon = "user-bookmarks"
name = "clipboard"
avoid_line_breaks = true
placeholder = "Clipboard"
image_height = 300
max_entries = 10
switcher_only = true
hidden = false

[builtins.commands]
hidden = true

[builtins.custom_commands]
hidden = true

[builtins.emojis]
name = "Emojis"
icon = ""
prefix = ":"

[builtins.symbols]
name = "Symbols"
after_copy = ""
hidden = false
prefix = "@"

[builtins.finder]
use_fd = true
cmd_alt = "xdg-open $(dirname ~/%RESULT%)"
icon = "file"
name = "Finder"
preview_images = true
hidden = false
prefix = "."

[builtins.runner]
shell_config = ""
switcher_only = true
hidden = true

[builtins.ssh]
hidden = true

[builtins.websearch]
switcher_only = true
hidden = true
prefix = "?"

[builtins.websearch.entries]
name = "Unduck"
url = "https://unduck-sw.vercel.app?q=%TERM%"

[keys]
close = ["esc", "ctrl ["]
next = ["down", "ctrl n"]
prev = ["up", "ctrl p"]
