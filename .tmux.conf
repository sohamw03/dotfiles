set -g prefix M-i
bind M-i send-prefix
unbind C-b

set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 9999999
set -g focus-events on

set -g mouse on
unbind -n MouseDrag1Pane
setw -g mode-keys vi
setw -g monitor-activity on

bind-key v split-window -h
bind-key s split-window -v

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use arrow keys prefix key to switch panes
bind Left previous-window
bind Right next-window

# Turn off confirmation while closing a pane
unbind x
bind x kill-pane

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# Sixel
# set -gq allow-passthrough on

# Plugins
set -g @plugin 'tmux-plugins/tpm'

# Catpuccin
# set -g @plugin 'catppuccin/tmux#v2.1.3'
# set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -agF status-right "#{E:@catppuccin_status_session}"
set-window-option -g status-position top

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
# ——— Override Catppuccin palette to your dark scheme ———
# Your palette mappings (keep these if you already set them)
set -g @thm_text      "#ebdbb2"
set -g @thm_fg        "#ebdbb2"
set -g @thm_mantle    "default"
set -g @thm_base      "#181715"
set -g @thm_crust     "#181715"
set -g @thm_surface_2 "#a8a39f"
set -g @thm_surface_1 "#a8a39f"
set -g @thm_surface_0 "default"

set -g @thm_red    "#cc241d"
set -g @thm_green  "#98971a"
set -g @thm_yellow "#b57614"
set -g @thm_blue   "#458588"
set -g @thm_mauve  "#b16286"
set -g @thm_teal   "#689d6a"
set -g @thm_peach  "#af3a03"

# Keep status transparent and readable
set -g @catppuccin_status_background "none"
set -g status-style "bg=default,fg=#{@thm_text}"

# ——— AFTER Catppuccin is loaded ———
set -g window-status-separator " "
set -g window-status-format '#[bg=default,fg=#{@thm_surface_2}] #I #[nobold,fg=#{@thm_fg}]#W '
set -g window-status-current-format '#[bg=default,bold,fg=#{@thm_peach}] #I #[bold,fg=#{@thm_text}]#W '
set -g window-status-activity-style 'bg=default,fg=#{@thm_yellow},bold'
set -g visual-activity off

# Keep right-side modules transparent (if you’re using them)
set -g @catppuccin_status_directory_bg_color "default"
set -g @catppuccin_status_user_bg_color      "default"
set -g @catppuccin_status_session_bg_color   "default"
set -g @catppuccin_status_date_time_bg_color "default"

# Tweak their colors to your palette
set -g @catppuccin_directory_color "#{@thm_peach}"  # orange
set -g @catppuccin_user_color      "#{@thm_blue}"   # blue
set -g @catppuccin_session_color   "#{@thm_yellow}" # yellow
# ---

# Tmux copy to clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux logging
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path '#{pane_current_path}'
set -g @save-complete-history-path '#{pane_current_path}'
set -g @screen-capture-path '#{pane_current_path}'

run '~/.tmux/plugins/tpm/tpm'
